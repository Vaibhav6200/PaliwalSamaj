<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <!-- Favicon
  ================================================== -->

    <!-- CSS

    <!-- Bootstrap -->

    <!-- Custom css -->

</head>
<body>
<div class="body-inner">

    {% block content %}
    {% endblock %}


    <!-- initialize jQuery Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.js" ></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" ></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.21.0/jquery.validate.min.js" ></script>
    <!-- Bootstrap jQuery -->
    <script src="{% static 'plugins/bootstrap/bootstrap.min.js' %}" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <!-- Slick Carousel -->
    <script src="{% static 'plugins/slick/slick.min.js' %}"></script>
    <script src="{% static 'plugins/slick/slick-animation.min.js' %}"></script>
    <!-- Color box -->
    <script src="{% static 'plugins/colorbox/jquery.colorbox.js' %}"></script>
    <!-- shuffle -->
    <script src="{% static 'plugins/shuffle/shuffle.min.js' %}" defer></script>
    <!-- Google Map API Key-->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCcABaamniA6OL5YvYSpB3pFMNrXwXnLwU" defer></script>
    <!-- Google Map Plugin-->
    <script src="{% static 'plugins/google-map/map.js' %}" defer></script>
    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <!-- sweet alert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Autocomplete -->
    <script src="https://unpkg.com/@trevoreyre/autocomplete-js"></script>
    <!-- Template custom -->
    <script src="{% static 'js/script.js' %}"></script>
    <script src="{% static 'js/index.js' %}"></script>

    {% include 'Includes/messages.html' %}

    {% block javascripts %} {% endblock javascripts %}



{% if request.session.show_ad %}
<script>
    const imageUrl = "{{ request.session.sponsor_image_url|escapejs }}";
    const sponsorName = "{{ request.session.sponsor_name|escapejs }}";
    const sponsorMessage = `{{ request.session.sponsor_message|escapejs }}`;
    const sponsorTimer = {{ request.session.sponsor_timer|default:5000 }};

    const img = new Image();
    img.src = imageUrl;

    img.onload = function() {
        Swal.fire({
            {% if request.session.sponsor_name %}
            title: '{{ request.session.sponsor_name|escapejs }}',
            {% endif %}
            html: `
                <img src="{{ request.session.sponsor_image_url|escapejs }}" alt="Sponsor Ad" style="max-width:100%; height:auto;" />
                {% if request.session.sponsor_message %}
                <p class='mt-3'>{{ request.session.sponsor_message|escapejs }}</p>
                {% endif %}
            `,
            width: '900px',
            timer: sponsorTimer,
            timerProgressBar: true,
            showConfirmButton: false,
            allowOutsideClick: false,
        });
    };

    img.onerror = function() {
        console.error("Failed to load sponsor image.");
        // Optionally show a fallback alert or skip the ad.
    };
</script>
{% endif %}


</div>
</body>

</html>
